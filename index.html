<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEET 2027 Chemistry Quiz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body data-theme="light">
  <header>
    <h2>NEET 2027 Chem: Basic Concepts</h2>
    <div>
      <span id="timer">00:00</span>
      <button onclick="toggleTheme()" style="margin-left:15px; cursor:pointer;">Toggle Theme</button>
    </div>
  </header>
  
  <div class="container" id="quiz-screen">
    <div class="main-content">
      <div id="q-header"><h3>Question <span id="q-num">1</span> of 40</h3></div>
      <div id="question-text" style="font-size: 1.2em; font-weight: bold; margin-bottom: 20px;"></div>
      <div class="options" id="options-container"></div>
      
      <div class="controls">
        <button onclick="prevQuestion()">Previous</button>
        <button onclick="markReview()">Mark for Review & Next</button>
        <button onclick="clearResponse()">Clear Response</button>
        <button onclick="nextQuestion()">Save & Next</button>
      </div>

      <div class="explanation" id="explanation-box"></div>
    </div>
    
    <div class="sidebar">
      <h3>Question Palette</h3>
      <div style="font-size: 12px; margin-bottom: 10px;">
        <span style="color:var(--correct)">■</span> Answered 
        <span style="color:var(--wrong)">■</span> Not Answered<br>
        <span style="color:var(--review)">■</span> Marked
        <span style="color:#e9ecef">■</span> Not Visited
      </div>
      <div class="palette-grid" id="palette"></div>
      <button onclick="submitQuiz()" style="margin-top: 20px; width:100%; background:var(--primary); color:white; padding:10px; border:none; border-radius:5px; cursor:pointer;">SUBMIT TEST</button>
    </div>
  </div>

  <div class="container" id="result-screen" style="display:none; flex-direction:column; overflow-y:auto; background:var(--panel-bg);">
    <h2 style="text-align:center;">Result Analysis - AIR Prediction</h2>
    <div style="display:flex; justify-content:space-around; flex-wrap:wrap; margin: 20px 0;">
      <div class="chart-container"><canvas id="pieChart"></canvas></div>
      <div class="chart-container"><canvas id="barChart"></canvas></div>
    </div>
    <div id="analysis-text" style="text-align:center; font-size:1.2em;"></div>
    <div class="controls" style="justify-content:center;">
      <button onclick="reviewMistakes()">Review Mistakes</button>
      <button onclick="exportPDF()">Export PDF</button>
      <button onclick="location.reload()">Retry Test</button>
    </div>
    <div id="review-area" style="margin-top: 30px;"></div>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
